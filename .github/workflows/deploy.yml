name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # A copy of the repo without the Cloudflare secrets has nothing to deploy to.
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
        run: sh tools/check-deploy-secrets.sh

  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      # npm does not run dependency install scripts in every version.
      - run: |
          npm install --global bun@1.4.4
          bun_package_dir="$(npm root --global)/bun"
          if ! "$bun_package_dir/bin/bun.exe" --version; then
            (cd "$bun_package_dir" && node install.js)
          fi
      - run: bun install --frozen-lockfile
      - run: npm test
      - run: sh tools/deploy.sh
        # Every name in cloudflare.example.env, read from the repository secrets.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
          ALIAS_HOST: ${{ secrets.ALIAS_HOST }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_HOSTNAMES: ${{ secrets.TURNSTILE_HOSTNAMES }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          THEME_KEY_PREFIX: ${{ secrets.THEME_KEY_PREFIX }}
          THEME_COOKIE_DOMAIN: ${{ secrets.THEME_COOKIE_DOMAIN }}
          SITE_FAMILY: ${{ secrets.SITE_FAMILY }}
          RELATED_SITE_HTML: ${{ secrets.RELATED_SITE_HTML }}
