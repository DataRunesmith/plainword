name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # npm does not run dependency install scripts in every version.
      - run: |
          npm install --global bun@1.4.4
          bun_package_dir="$(npm root --global)/bun"
          if ! "$bun_package_dir/bin/bun.exe" --version; then
            (cd "$bun_package_dir" && node install.js)
          fi
      - run: bun install --frozen-lockfile
      - run: npm test
      - run: sh tools/deploy.sh cloudflare.example.env --dry-run
      - run: node tools/check-addresses.mjs
